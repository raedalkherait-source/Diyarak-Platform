name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Frontend behavior tests
        run: node --test tests/Frontend/public-listing-pagination.test.cjs
      - run: dotnet restore Diyarak.Platform.All.sln
      - run: dotnet format Diyarak.Platform.All.sln --verify-no-changes --no-restore
      - run: dotnet build Diyarak.Platform.All.sln -c Release --no-restore
      - run: dotnet test Diyarak.Platform.All.sln -c Release --no-build --logger "trx;LogFilePrefix=test-results"
      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14


  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/Diyarak.Portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Frontend/Diyarak.Portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api --target api -t diyarak-api:ci .
      - name: Build migrations image
        run: docker build -f deploy/Dockerfile.api --target migrations -t diyarak-migrations:ci .
      - name: Build portal image
        run: docker build -f deploy/Dockerfile.portal -t diyarak-portal:ci src/Frontend/Diyarak.Portal
      - name: Validate production compose file
        run: |
          printf 'PORTAL_DOMAIN=diyarak.example\nAPI_DOMAIN=api.diyarak.example\nACME_EMAIL=ops@diyarak.example\nPOSTGRES_PASSWORD=ci-only\n' > /tmp/ci.env
          cp deploy/api.env.example deploy/api.env
          docker compose -f deploy/compose.production.yaml --env-file /tmp/ci.env config --quiet

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Diyarak.Platform.All.sln
      - run: dotnet build Diyarak.Platform.All.sln -c Release --no-restore
      - run: dotnet test Diyarak.Platform.All.sln -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/test-results/**/coverage.*
          if-no-files-found: error

  pack:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Diyarak.Platform.Foundation.sln
      - run: dotnet build Diyarak.Platform.Foundation.sln -c Release --no-restore
      - run: dotnet pack Diyarak.Platform.Foundation.sln -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-packages
          path: artifacts/packages/*.*nupkg
