name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Frontend behavior tests
        run: node --test tests/Frontend/public-listing-pagination.test.cjs
      - run: dotnet restore Diyarak.Platform.All.sln
      - run: dotnet format Diyarak.Platform.All.sln --verify-no-changes --no-restore
      - run: dotnet build Diyarak.Platform.All.sln -c Release --no-restore
      - run: dotnet test Diyarak.Platform.All.sln -c Release --no-build --logger "trx;LogFilePrefix=test-results"
      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14


  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Diyarak.Platform.All.sln
      - run: dotnet build Diyarak.Platform.All.sln -c Release --no-restore
      - run: dotnet test Diyarak.Platform.All.sln -c Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/test-results/**/coverage.*
          if-no-files-found: error

  pack:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Diyarak.Platform.Foundation.sln
      - run: dotnet build Diyarak.Platform.Foundation.sln -c Release --no-restore
      - run: dotnet pack Diyarak.Platform.Foundation.sln -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-packages
          path: artifacts/packages/*.*nupkg
