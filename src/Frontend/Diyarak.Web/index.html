<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diyarak</title>
  <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">Diyarak</p>
      <h1>Find your next property</h1>
      <p class="hero-copy">
        Explore published listings with safe public property details.
      </p>
    </section>

    <section class="toolbar" aria-label="Listing controls">
      <button id="load-listings" type="button">Refresh listings</button>
      <p id="status" role="status">Ready.</p>
      <button id="retry-listings" class="secondary-button" type="button" hidden>Retry</button>
      <a class="secondary-button" href="/api/market/public/listings" target="_blank" rel="noopener">Open API JSON</a>
      <a class="secondary-button" href="/openapi/v1.json" target="_blank" rel="noopener">OpenAPI</a>
      <a class="secondary-button" href="/app">Frontend Home</a>
    </section>

    <form id="listing-filters" aria-label="Public listing filters">
      <fieldset id="listing-filter-fields">
        <legend>Filter listings</legend>
        <label for="filter-city">City
          <input id="filter-city" name="city" type="text" autocomplete="address-level2">
        </label>
        <label for="filter-intent">Transaction intent
          <select id="filter-intent" name="transactionIntent">
            <option value="">Any transaction</option>
            <option value="Rent">For rent</option>
            <option value="Sell">For sale</option>
            <option value="RentForLimitedPeriod">For rent for a limited period</option>
          </select>
        </label>
        <label for="filter-category">Property category
          <select id="filter-category" name="propertyCategory">
            <option value="">Any category</option>
            <option value="Apartment">Apartment</option>
            <option value="House">House</option>
            <option value="Plot">Plot</option>
            <option value="InvestmentProperty">Investment property</option>
            <option value="GarageOrParkingSpace">Garage or parking space</option>
            <option value="CommercialProperty">Commercial property</option>
          </select>
        </label>
        <div class="filter-actions">
          <button type="submit">Apply filters</button>
          <button id="clear-filters" class="secondary-button" type="button">Clear filters</button>
        </div>
      </fieldset>
    </form>

    <section>
      <h2 id="listing-heading">Public listings</h2>
      <a id="back-to-listings" class="secondary-button" href="./index.html" hidden>Back to listings</a>
      <nav id="listing-pagination" class="toolbar" aria-label="Listing pages">
        <button id="previous-page" class="secondary-button" type="button" disabled>Previous page</button>
        <span id="current-page" aria-live="polite"></span>
        <button id="next-page" class="secondary-button" type="button" disabled>Next page</button>
      </nav>
      <div id="listing-grid" class="listing-grid" aria-live="polite"></div>
    </section>
  </main>

  <template id="listing-card-template">
    <article class="listing-card">
      <p class="listing-card__location"></p>
      <h3 class="listing-card__headline"></h3>
      <p class="listing-card__price"></p>
      <dl class="listing-card__facts">
        <div>
          <dt>Category</dt>
          <dd data-field="category"></dd>
        </div>
        <div>
          <dt>Living area</dt>
          <dd data-field="livingArea"></dd>
        </div>
        <div>
          <dt>Rooms</dt>
          <dd data-field="rooms"></dd>
        </div>
        <div>
          <dt>Bedrooms</dt>
          <dd data-field="bedrooms"></dd>
        </div>
        <div>
          <dt>Bathrooms</dt>
          <dd data-field="bathrooms"></dd>
        </div>
        <div>
          <dt>Features</dt>
          <dd data-field="features"></dd>
        </div>
        <div>
          <dt>Built</dt>
          <dd data-field="constructionYear"></dd>
        </div>
        <div>
          <dt>Parking</dt>
          <dd data-field="parking"></dd>
        </div>
        <div>
          <dt>Available</dt>
          <dd data-field="available"></dd>
        </div>
        <div data-detail="publishingRole" hidden>
          <dt>Publishing role</dt>
          <dd></dd>
        </div>
        <div data-detail="transactionIntent" hidden>
          <dt>Transaction intent</dt>
          <dd></dd>
        </div>
        <div data-detail="furnishingQuality" hidden>
          <dt>Furnishing quality</dt>
          <dd></dd>
        </div>
        <div data-detail="commercialSubtype" hidden>
          <dt>Commercial subtype</dt>
          <dd></dd>
        </div>
      </dl>
      <a class="listing-card__detail-link" href="./index.html" hidden>View listing details</a>
    </article>
  </template>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
